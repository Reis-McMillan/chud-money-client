# Rendered by the nginx image's envsubst at container start (this file lives
# under /etc/nginx/templates), which is what turns the ${...} placeholders in
# /config.js into the container's environment. Only variables that exist in
# the environment are substituted, so nginx's own $uri below is untouched.
server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime settings for the SPA, read by src/config.ts before anything
    # else runs. Change them on the container, not by rebuilding the image.
    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        return 200 'window.__CHUD_CONFIG__ = {"apiBase":"${API_BASE}","verysUrl":"${VERYS_URL}","verysClientId":"${VERYS_CLIENT_ID}","chudMoneyClientId":"${CHUD_MONEY_CLIENT_ID}"};\n';
    }

    # Vite fingerprints everything under /assets, so it can be cached forever;
    # index.html must not be, or a deploy leaves browsers on stale bundles.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history-mode fallback: /m/<tag> and /auth/callback are client routes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
